<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Janala</title>
    <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-[#f7f7f7]">
    <!-- Main Container -->
    <div class="mx-auto min-h-screen border-0 border-blue-0">
        <!-- Navbar -->
        <nav>
            <div>
             <!-- Navbar -->
        <nav class="flex items-center justify-between px-8 py-4 bg-[#e9edf2] border-b border-gray-300">
    
          <!-- Logo -->
          <div class="flex items-center gap-2">
            <h1 class="font-semibold text-[15px]">
              English <span class="text-[#00A8FF]">📘</span> জানালা
            </h1>
          </div>
    
          <!-- Nav Buttons -->
          <div class="flex items-center gap-3">
    
            <button
              class="border border-[#422AD5] text-[#422AD5] text-sm px-4 py-2 rounded hover:bg-[#422AD5] hover:text-white transition">
              ❓ FAQ
            </button>
    
            <button
              class="border border-[#422AD5] text-[#422AD5] text-sm px-4 py-2 rounded hover:bg-[#422AD5] hover:text-white transition">
              📚 Learn
            </button>
    
            <button
              class="border border-[#422AD5] text-[#422AD5] text-sm px-4 py-2 rounded hover:bg-[#422AD5] hover:text-white transition">
              🔓 Logout
            </button>
    
          </div>
        </nav>
        </div>
        </nav>
        <!-- Hero Section -->
    <section
      class="flex flex-col-reverse lg:flex-row items-center justify-between px-10 lg:px-20 py-20 gap-16">

      <!-- Left Content -->
      <div class="max-w-xl">

        <h1 class="text-5xl font-bold leading-tight mb-6">
          <span class="text-[#00A8FF]">English</span>
          <span class="text-black">is Easy!!</span>
        </h1>

        <p class="text-gray-700 leading-8 text-lg mb-8">
          আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা
          আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে
          যাবে অন্য এক Level এ।
        </p>

        <!-- Form -->
        <div class="space-y-4 w-full max-w-sm">

          <input
            type="text"
            placeholder="Enter Your Name"
            class="w-full px-4 py-3 border border-gray-300 rounded outline-none focus:border-[#422AD5]"
          />

          <input
            type="password"
            placeholder="********"
            class="w-full px-4 py-3 border border-gray-300 rounded outline-none focus:border-[#422AD5]"
          />

          <button
            class="bg-[#422AD5] hover:bg-[#321db4] text-white px-6 py-3 rounded font-medium transition">
            Get Started
          </button>

        </div>
      </div>

      <!-- Right Image -->
      <div class="">
        <!-- Circle -->
        <div>
          <!-- Demo Image -->
          <img
            src="assets/hero-student.png"
            alt="assets/hero-student.pngStudent"
          />

        </div>
      </div>

    </section>
    </div>
</body>
</html>
